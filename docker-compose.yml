services:
  siteping:
    build: .
    container_name: siteping
    restart: unless-stopped
    ports:
      - "8130:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SITEPING_API_KEY: ${SITEPING_API_KEY}
      SITEPING_ADMIN_PASSWORD: ${SITEPING_ADMIN_PASSWORD}
      SITEPING_SESSION_SECRET: ${SITEPING_SESSION_SECRET}
      SITEPING_ALLOWED_ORIGINS: ${SITEPING_ALLOWED_ORIGINS}
      SITEPING_DASHBOARD_PROJECTS: ${SITEPING_DASHBOARD_PROJECTS}
      SITEPING_BASE_URL: ${SITEPING_BASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: siteping-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: siteping
      POSTGRES_USER: siteping
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /volume1/docker/siteping/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siteping -d siteping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
